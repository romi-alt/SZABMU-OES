# STAFF AND ADMIN PORTAL — https://dashboard.szabmu.site . Install as /etc/nginx/sites-available/dashboard.szabmu.site and symlink into sites-enabled. TEMPLATE — not installed.
# Obtain the certificate first (HTTP-01):  certbot certonly --webroot -w /var/www/certbot -d dashboard.szabmu.site   (DNS must already point at this VPS)

server {
  listen 80;
  listen [::]:80;
  server_name dashboard.szabmu.site;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dashboard.szabmu.site;
  access_log /var/log/nginx/oes-staff.access.log oes;
  error_log  /var/log/nginx/oes-staff.error.log warn;

  ssl_certificate     /etc/letsencrypt/live/dashboard.szabmu.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dashboard.szabmu.site/privkey.pem;
  include snippets/oes-tls.conf;
  include snippets/oes-security-headers.conf;

  client_max_body_size 2m;     # matches the API body limit (2 MiB); staff import files are JSON bodies within this limit
  limit_conn oes_conn 200;

  # The metrics endpoint is for the monitoring agent on this host (bearer token, loopback). Never public.
  location = /api/metrics { return 404; }

  # Live exam events (Server-Sent Events). No buffering, no caching, long read timeout; the browser reconnects with Last-Event-ID.
  location ~ ^/api/invigilation/exams/[^/]+/stream$ {
    proxy_pass http://oes_api;
    include snippets/oes-proxy.conf;
    proxy_set_header X-OES-Portal staff;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Accel-Buffering "no" always;
    include snippets/oes-security-headers.conf;
  }

  # Sign-in and recovery: generous edge brake only (see 00-oes-http.conf).
  location ~ ^/api/auth/(login|forgot|verify-code|reset)$ {
    limit_req zone=oes_auth burst=120 nodelay;
    proxy_pass http://oes_api;
    include snippets/oes-proxy.conf;
    proxy_set_header X-OES-Portal staff;
    add_header Cache-Control "no-store" always;
    include snippets/oes-security-headers.conf;
  }

  # Everything else on the API: answer saves, exam start/submit, results. Never cached, never buffered to disk for responses.
  location /api/ {
    proxy_pass http://oes_api;
    include snippets/oes-proxy.conf;
    proxy_set_header X-OES-Portal staff;     # overwrites any value the client sent
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
    include snippets/oes-security-headers.conf;
  }

  # Pages and static assets from the student Next.js process (PORTAL=student).
  location / {
    proxy_pass http://oes_web_staff;
    include snippets/oes-proxy.conf;
    proxy_read_timeout 60s;
  }
}
