# http{}-level settings for both OES vhosts. Install as /etc/nginx/conf.d/00-oes-http.conf (conf.d is included inside http{}). TEMPLATE — not installed.

server_tokens off;

# Never log cookies, authorization headers or query strings (public certificate verification carries a code in the query).
log_format oes '$remote_addr [$time_local] $host "$request_method $uri" $status $body_bytes_sent $request_time ua="$http_user_agent"';

# Abuse brake for the sign-in/recovery endpoints only. Many candidates share one campus NAT address, so this is deliberately generous;
# the real, per-account limits are enforced by the API (account lockout, 20/15 min per account, 60/15 min per IP — see risk R-07).
limit_req_zone $binary_remote_addr zone=oes_auth:10m rate=240r/m;
limit_conn_zone $binary_remote_addr zone=oes_conn:10m;

# Upstreams on loopback only (published by docker-compose.prod.yml).
upstream oes_api       { server 127.0.0.1:4000; keepalive 64; }
upstream oes_web_student { server 127.0.0.1:3101; keepalive 32; }
upstream oes_web_staff   { server 127.0.0.1:3102; keepalive 32; }
