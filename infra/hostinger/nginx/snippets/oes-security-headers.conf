# Response security headers. Included at server level AND inside every location that sets its own add_header
# (nginx drops inherited add_header lines as soon as a location declares one). Install as /etc/nginx/snippets/oes-security-headers.conf. TEMPLATE.
# HSTS for THIS hostname only. No includeSubDomains / preload: the parent domain szabmu.site is not served from this VPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
