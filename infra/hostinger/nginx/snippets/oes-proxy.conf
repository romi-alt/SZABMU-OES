# Headers every proxied request carries. Install as /etc/nginx/snippets/oes-proxy.conf. TEMPLATE.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite, never append: a client-supplied X-Forwarded-For must not reach the API (TRUST_PROXY=true makes it the identity for rate limits and audit).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
