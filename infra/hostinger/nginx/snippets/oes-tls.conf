# TLS and transport-security settings shared by both vhosts. Install as /etc/nginx/snippets/oes-tls.conf. TEMPLATE.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:oes_ssl:10m;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
