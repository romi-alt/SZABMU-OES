name: CI
# Pushes to claude/** branches run CI too, so work that lands directly on a shared branch is checked, not only pull requests.
# (A branch with an open PR therefore gets two runs per push: one for the branch, one for the merge with its base.)
on: { push: { branches: [main, 'claude/**'] }, pull_request: {} }
# A newer push to the same ref supersedes a run that is still going.
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Same engine and major version as production (Hostinger managed MariaDB 11.8), READ COMMITTED like production.
      mariadb:
        image: mariadb:11.8
        env: { MARIADB_USER: oes, MARIADB_PASSWORD: oes_dev_password, MARIADB_DATABASE: szabmu_oes_test, MARIADB_ROOT_PASSWORD: ci_root_password }
        ports: ["3307:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6390:6379"]
    env:
      TEST_DATABASE_URL: mysql://oes:oes_dev_password@127.0.0.1:3307/szabmu_oes_test
      DATABASE_URL: mysql://oes:oes_dev_password@127.0.0.1:3307/szabmu_oes_test
      REDIS_URL: redis://localhost:6390
      COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdef0123
      RECEIPT_SECRET: ci-only-receipt-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - name: Match production MariaDB settings (READ COMMITTED, stored routines allowed)
        run: |
          for i in $(seq 1 30); do docker exec "$(docker ps -qf ancestor=mariadb:11.8)" mariadb -uroot -pci_root_password -e "SET GLOBAL transaction_isolation='READ-COMMITTED'; SET GLOBAL max_connections=500; GRANT ALL ON *.* TO 'oes'@'%'" && break; sleep 2; done
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y redis-tools   # tests/e2e/global-setup.ts flushes Redis with redis-cli
      - run: cp .env.example .env   # e2e starts the API/seed with `node --env-file=.env`; job-level env vars still take precedence
      - run: npm run test:e2e

  # Hostinger managed Node.js hosting offers Node 18 / 20 / 22 / 24 only; the repo declares engines >=26. This job is the evidence for
  # whether the application builds and passes its tests on the version it will actually run on (24). No e2e here: that runs on `verify`.
  # It also runs WITHOUT Redis (like Hostinger), so both coordination backends are tested on every push: Redis on `verify`, database here.
  node24:
    runs-on: ubuntu-latest
    services:
      # Same engine and major version as production (Hostinger managed MariaDB 11.8), READ COMMITTED like production.
      mariadb:
        image: mariadb:11.8
        env: { MARIADB_USER: oes, MARIADB_PASSWORD: oes_dev_password, MARIADB_DATABASE: szabmu_oes_test, MARIADB_ROOT_PASSWORD: ci_root_password }
        ports: ["3307:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: mysql://oes:oes_dev_password@127.0.0.1:3307/szabmu_oes_test
      DATABASE_URL: mysql://oes:oes_dev_password@127.0.0.1:3307/szabmu_oes_test
      OES_TEST_KV: database   # no Redis at all, exactly like the Hostinger deployment: coordination state in MariaDB, jobs in process
      COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdef0123
      RECEIPT_SECRET: ci-only-receipt-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: node --version
      - name: Match production MariaDB settings (READ COMMITTED, stored routines allowed)
        run: |
          for i in $(seq 1 30); do docker exec "$(docker ps -qf ancestor=mariadb:11.8)" mariadb -uroot -pci_root_password -e "SET GLOBAL transaction_isolation='READ-COMMITTED'; SET GLOBAL max_connections=500; GRANT ALL ON *.* TO 'oes'@'%'" && break; sleep 2; done
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Worker and reconcile entry points exist after the build
        run: test -f apps/api/dist/main.js && test -f apps/api/dist/worker.js && test -f apps/api/dist/cron/reconcile.js
