# Local development stack. NOT a production deployment: dev credentials, single instances, no TLS.
# Usage:  cp .env.example .env && docker compose up -d postgres minio mailpit
#         npm install && npm run build && npm run db:migrate && npm run db:seed
#         npm run dev:api   (terminal 1)     npm run dev:web   (terminal 2)
# Or run everything containerised:  docker compose --profile app up --build
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: oes, POSTGRES_PASSWORD: oes_dev_password, POSTGRES_DB: szabmu_oes }
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    # synchronous_commit stays ON: an answer may show "Saved" only after a durable commit.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB", "-c", "synchronous_commit=on", "-c", "wal_compression=on"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U oes -d szabmu_oes"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: oes_dev_minio, MINIO_ROOT_PASSWORD: oes_dev_minio_secret }
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    environment:
      NODE_ENV: development   # this compose file is a LOCAL dev stack with dev credentials; production config validation would (rightly) refuse it
      DATABASE_URL: postgresql://oes:oes_dev_password@postgres:5432/szabmu_oes
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    ports: ["127.0.0.1:4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.web }
    environment: { API_INTERNAL_URL: http://api:4000 }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, miniodata: {} }
