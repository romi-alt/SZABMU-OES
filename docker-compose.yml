# Local development stack. NOT a production deployment: dev credentials, single instances, no TLS.
# Usage:  cp .env.example .env && docker compose up -d mariadb redis minio mailpit
#         npm install && npm run build && npm run db:migrate && npm run db:seed
#         npm run dev:api   (terminal 1)     npm run dev:web   (terminal 2)
# Or run everything containerised:  docker compose --profile app up --build
services:
  # Same engine/version as production (Hostinger managed MariaDB 11.8). innodb_flush_log_at_trx_commit=1 (the default) keeps every
  # commit durable: an answer may show "Saved" only after a durable commit.
  mariadb:
    image: mariadb:11.8
    environment: { MARIADB_USER: oes, MARIADB_PASSWORD: oes_dev_password, MARIADB_DATABASE: szabmu_oes, MARIADB_ROOT_PASSWORD: oes_dev_root }
    ports: ["127.0.0.1:3307:3306"]
    volumes: [mariadbdata:/var/lib/mysql, ./infra/mariadb-init:/docker-entrypoint-initdb.d:ro]
    command: ["--transaction-isolation=READ-COMMITTED", "--max-connections=500", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-flush-log-at-trx-commit=1"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6390:6379"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: oes_dev_minio, MINIO_ROOT_PASSWORD: oes_dev_minio_secret }
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    environment:
      NODE_ENV: development   # this compose file is a LOCAL dev stack with dev credentials; production config validation would (rightly) refuse it
      DATABASE_URL: mysql://oes:oes_dev_password@mariadb:3306/szabmu_oes
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    ports: ["127.0.0.1:4000:4000"]
    depends_on: { mariadb: { condition: service_healthy }, redis: { condition: service_healthy } }
  web:
    profiles: [app]
    build: { context: ., dockerfile: infra/Dockerfile.web }
    environment: { API_INTERNAL_URL: http://api:4000 }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes: { mariadbdata: {}, miniodata: {} }
